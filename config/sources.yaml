    url: https://www.mofa.go.jp/policy/other/bluebook/index.html
    licence: MOFA Japan terms
    redistribution: derived measures
    notes: Manual task M9.
    reader: null
    column_map: null

  jp_meti_whitepaper:
    name: Japan METI/MITI White Papers on International Economy and Trade (通商白書)
    category: historical_text
    status: manual
    access: HTTP 403 to automated clients (2026-09-30)
    url: https://www.meti.go.jp/report/gaisei/index.html
    licence: METI terms
    redistribution: derived measures
    notes: Manual task M9.
    reader: null
    column_map: null

  us_frus:
    name: Foreign Relations of the United States (TEI XML on GitHub)
    category: historical_text
    status: validated
    access: public GitHub repository (git clone); history.state.gov
    url: https://github.com/HistoryAtState/frus
    licence: public domain (US government work)
    redistribution: allowed
    notes: Not cloned yet (several GB); next-step task.
    reader: null
    column_map: null

  us_presidential:
    name: Public Papers of the Presidents (govinfo)
    category: historical_text
    status: candidate
    access: govinfo collection pages reachable; API needs an api.data.gov key
    url: null
    licence: public domain
    notes: Candidate for US -> Japan extension.
    reader: null
    column_map: null

  us_ustr:
    name: USTR reports and releases (e.g., National Trade Estimate reports)
    category: historical_text
    status: candidate
    access: TBD
    url: null
    licence: public domain
    notes: Historical extension only.
    reader: null
    column_map: null

  # ================================================================ YouTube (public discourse)
  youtube:
    name: YouTube Data API v3 (search, videos, channels, commentThreads, comments, captions.list)
    category: public_text
    construct: [P_public_attention, P_public_recognition]
    status: partial
    access: official API with a Google Cloud API key (configured 2026-09-30 in .env)
    url: https://developers.google.com/youtube/v3
    licence: YouTube API Services Terms of Service and Developer Policies
    redistribution: comment IDs and derived labels only; no raw comment corpus redistribution
    coverage: {countries: "pilot VNM, CHN, KHM, SGP", years: "2010-2026", frequency: comment}
    variables: see docs/youtube_data_design.md
    unit: video / comment
    script: scripts/youtube/run_youtube.py
    notes: Pilot run 2026-09-30 (collection run folder data/raw/youtube/2026-09-30/); see docs/youtube_collection_status.md.
    reader: null
    column_map: null

  # ================================================================ Project-generated inputs
  human_coding:
    name: Human coding sheets returned by coders (project-generated)
    category: internal
    status: in_use
    access: produced by this project; see docs/coding_protocol.md
    url: null
    licence: project
    notes: Completed coding sheets are treated as raw, immutable inputs.
    reader: null
    column_map: null
