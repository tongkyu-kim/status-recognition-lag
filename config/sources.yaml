# Candidate data sources. EVERY entry is a candidate requiring validation before use:
# coverage, access conditions, terms of use / licence, and redistribution rights must be checked
# and recorded in docs/data_sources.md and docs/decisions.md.
#
# Fields
#   status:     candidate | validated | in_use | rejected
#   access:     how data will be obtained (manual download, bulk file, API) - TBD until validated
#   url:        verified landing page, recorded only after validation (null until then)
#   reader:     how raw files are parsed, e.g. {format: csv, encoding: utf-8, skiprows: 0}
#   column_map: mapping from source column names to canonical names (see src/srl/cleaning/)
# `reader` and `column_map` stay null until real files are inspected. Cleaning code raises
# NotImplementedError while they are null, so nothing silently guesses a file layout.
#
# The key of each entry is the <source_id> used for data/raw/<source_id>/<YYYY-MM-DD>/.

